<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kitchen OS">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#faf6ef">
<meta name="format-detection" content="telephone=no">
<title>Kitchen OS</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="scrim"></div>
<div class="demo-banner" id="demoBanner" hidden>Demo walkthrough — nothing you do here is saved</div>
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark" id="brandMark">KO</div>
      <div class="brand-text">
        <div class="brand-name" id="brandName">Kitchen OS</div>
        <div class="brand-sub" id="brandSub">Meal prep &amp; event catering</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="nav-foot">
      <div class="user-chip">
        <div class="avatar" id="userAvatar">·</div>
        <div style="min-width:0">
          <div style="font-weight:700; font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap" id="userName">—</div>
          <div style="font-size:10.5px; color:var(--ink-faint)" id="userRole">—</div>
        </div>
      </div>
      <button class="logout-btn" id="logoutBtn">Sign out</button>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div style="display:flex; align-items:center; gap:10px">
        <button class="menu-btn" id="menuBtn" aria-label="Menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div>
          <h1 id="viewTitle">Dashboard</h1>
          <div class="sub" id="viewSub"></div>
        </div>
      </div>
      <div class="topbar-actions" id="topbarActions"></div>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>
<script src="/js/app.js" type="module"></script>
</body>
</html>
